<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Publicar</title>
<style>
  @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue-Regular.ttf") format("truetype"); font-display: swap; }
  :root {
    --bg: #15202a; --panel: #1d2b37; --panel2: #243644; --line: #314757;
    --text: #e8eff2; --muted: #8fa3af; --teal: #3ec6c9; --teal-d: #2b9da0;
    --danger: #ff7272; --warn: #ffc261; --ok: #5bd69a; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .lock-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .lock-card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 28px 24px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .lock-card h1 { font-family: "Bebas", Impact, sans-serif; font-weight: 400; letter-spacing: .02em;
    font-size: 52px; line-height: 1; margin: 0; color: var(--teal); }
  .lock-card p { margin: 6px 0 20px; color: var(--muted); font-size: 14px; }
  .pw-row { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
  .pw-row input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 11px 64px 11px 14px; font: inherit; }
  .pw-row input:focus { outline: none; border-color: var(--teal); }
  .pw-toggle { position: absolute; right: 8px; background: transparent; border: 0; color: var(--muted);
    cursor: pointer; padding: 4px 8px; font-size: 13px; border-radius: 6px; }
  .pw-toggle:hover { color: var(--text); }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px;
    margin-bottom: 18px; cursor: pointer; user-select: none; }
  .remember input { accent-color: var(--teal); width: 15px; height: 15px; margin: 0; }
  .unlock-btn { width: 100%; background: var(--teal); color: #0d1b22; border: 1px solid var(--teal);
    border-radius: 999px; font: inherit; font-weight: 650; font-size: 16px; padding: 11px 20px; cursor: pointer; }
  .unlock-btn:hover:not(:disabled) { background: #5fd6d8; }
  .unlock-btn:disabled { opacity: .5; cursor: not-allowed; }
  .lock-err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="lock-wrap" id="lockScreen">
  <form class="lock-card" id="lockForm" autocomplete="on">
    <h1>Publicar</h1>
    <p>Área protegida. Introduz a password para continuar.</p>
    <div class="pw-row">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password" required autofocus>
      <button type="button" class="pw-toggle" id="pwToggle" aria-label="Mostrar password">Ver</button>
    </div>
    <label class="remember">
      <input type="checkbox" id="rememberPw" checked>
      Guardar sessão neste navegador
    </label>
    <button type="submit" class="unlock-btn" id="unlockBtn">Entrar</button>
    <div class="lock-err" id="lockErr" role="alert"></div>
  </form>
</div>

<script>
(() => {
  const STORAGE_KEY = "pub.session.pw";
  const b64ToBytes = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const $ = (id) => document.getElementById(id);

  $("pwToggle").onclick = () => {
    const inp = $("pwInput");
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    $("pwToggle").textContent = show ? "Ocultar" : "Ver";
    inp.focus();
  };

  async function tryUnlock(pw, fromStorage = false) {
    const btn = $("unlockBtn");
    const err = $("lockErr");
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "A desencriptar…";
    try {
      const bundle = JSON.parse($("encrypted-bundle").textContent);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(bundle.salt), iterations: bundle.iter, hash: "SHA-256" },
        km,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(bundle.iv) },
        key,
        b64ToBytes(bundle.ct)
      );
      const html = new TextDecoder().decode(pt);
      if (!fromStorage) {
        try {
          if ($("rememberPw").checked) localStorage.setItem(STORAGE_KEY, pw);
          else localStorage.removeItem(STORAGE_KEY);
          sessionStorage.setItem(STORAGE_KEY, pw);
        } catch {}
      }
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      if (fromStorage) {
        try { localStorage.removeItem(STORAGE_KEY); sessionStorage.removeItem(STORAGE_KEY); } catch {}
      } else {
        err.textContent = "Password incorreta.";
        $("pwInput").select();
      }
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  }

  $("lockForm").onsubmit = (e) => {
    e.preventDefault();
    const pw = $("pwInput").value;
    if (pw) tryUnlock(pw, false);
  };

  try {
    const saved = sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
    if (saved) tryUnlock(saved, true);
  } catch {}
})();
</script>
